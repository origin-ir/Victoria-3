name: Victoria 3 Auto Localization Builder

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      download_url:
        description: 'Direct Link to English YML Zip File (Optional)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Prepare Workspace Directories
      run: |
        mkdir -p en_files
        mkdir -p fa_files

    - name: Download English Files from URL (If Provided)
      if: "${{ github.event.inputs.download_url != '' }}"
      run: |
        curl -L "${{ github.event.inputs.download_url }}" -o english_files.zip
        unzip -o english_files.zip -d en_files/

    - name: Execute Translation and Font Fix Script
      run: |
        python translate.py

    - name: Package Mod Files
      run: |
        cd fa_files
        zip -r ../Victoria3_Persian_Mod.zip .

    - name: Upload Finished Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Victoria3-Persian-Mod
        path: Victoria3_Persian_Mod.zip
