name: Build Desktop Executable App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies & PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install deep-translator arabic-reshaper python-bidi pyinstaller

    - name: Build Executable File (.exe)
      run: |
        pyinstaller --noconsole --onefile --name "Victoria3_Translator" app.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Victoria3_Translator_Windows
        path: dist/Victoria3_Translator.exe
